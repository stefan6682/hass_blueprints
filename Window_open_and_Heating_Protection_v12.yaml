blueprint:
  name: Window open and Heating Protection
  description: >
    # Window open and Heating Protection
  
    **Version: 0.12**
    
    
    Turns off thermostat(s) when a window is opened or tilted and restores their
    previous settings once the window is fully closed again. Optional delays
    avoid reacting to short airing. If the window stays open while it is cold
    outside, a notification is sent, followed by repeat reminders with action
    buttons (turn heating back on / snooze). Notifications are dismissed when
    the window closes.
    
  domain: automation
  author: Stefan Altenbuchner + ChatGPT & Claude - 18-11-2026
  homeassistant:
    min_version: 2024.10.0
  input:
    sensors:
      name: Sensors
      icon: mdi:window-open-variant
      collapsed: false
      input:
        door_sensor:
          name: Window open sensor
          description: Binary sensor that is "on" when the window is open.
          selector:
            entity:
              domain: binary_sensor
        tilt_sensor:
          name: Window tilt sensor
          description: Binary sensor that is "on" when the window is tilted.
          selector:
            entity:
              domain: binary_sensor
        outdoor_sensor:
          name: Outdoor temperature sensor
          selector:
            entity:
              domain: sensor
              device_class: temperature
    thermostat:
      name: Thermostat
      icon: mdi:radiator
      collapsed: false
      input:
        climate_entities:
          name: Thermostat(s)
          description: Climate entities to switch off while the window is open.
          selector:
            entity:
              domain: climate
              multiple: true
        scene_id:
          name: Snapshot scene ID
          description: >
            Unique ID (no "scene." prefix) for the temporary scene that stores
            the thermostat state. Use a different ID for each automation
            created from this blueprint.
          default: window_heating_snapshot
          selector:
            text:
    timing:
      name: Delays
      icon: mdi:timer-outline
      collapsed: false
      input:
        open_delay:
          name: Open delay
          description: >
            The window must stay open or tilted this long before the thermostat
            is switched off. Avoids reacting to short airing.
          default:
            hours: 0
            minutes: 0
            seconds: 30
          selector:
            duration:
        close_delay:
          name: Close delay
          description: >
            The window must stay fully closed this long before the thermostat
            is restored and notifications are dismissed.
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration:
    notification:
      name: Cold weather notification
      icon: mdi:bell-alert
      collapsed: true
      input:
        notify_devices:
          name: Notify devices
          description: Mobile app devices that receive the warnings.
          selector:
            device:
              integration: mobile_app
              multiple: true
        cold_threshold:
          name: Cold threshold
          description: Notify only when the outdoor temperature is below this value.
          default: 10
          selector:
            number:
              min: -30
              max: 30
              step: 0.5
              unit_of_measurement: °C
              mode: box
        cold_duration:
          name: Duration before notifying
          description: How long the window must stay open in the cold before notifying.
          default: 120
          selector:
            number:
              min: 1
              max: 720
              unit_of_measurement: min
              mode: box
        notify_title:
          name: Notification title
          default: Cold weather warning
          selector:
            text:
        notify_message:
          name: Notification message
          description: Outdoor temperature and open time are appended automatically.
          default: The window is still open or tilted. Please close it.
          selector:
            text:
    reminders:
      name: Reminders and action buttons
      icon: mdi:bell-ring
      collapsed: true
      input:
        reminder_interval:
          name: Reminder interval
          description: >
            Minutes between reminders while the window stays open. Set to 0 to
            disable reminders (the action buttons then do nothing, because
            nothing is waiting for them).
          default: 60
          selector:
            number:
              min: 0
              max: 720
              unit_of_measurement: min
              mode: box
        max_reminders:
          name: Maximum number of reminders
          description: Reminders sent after the first notification.
          default: 3
          selector:
            number:
              min: 1
              max: 20
              mode: box
        reminder_title:
          name: Reminder title
          default: Window still open
          selector:
            text:
        reminder_message:
          name: Reminder message
          description: Outdoor temperature and open time are appended automatically.
          default: The window is STILL open or tilted. Please close it now.
          selector:
            text:
        enable_buttons:
          name: Show action buttons
          description: >
            Adds "Turn heating back on" and "Snooze" buttons to the
            notifications.
          default: true
          selector:
            boolean:
        snooze_minutes:
          name: Snooze duration
          description: Pause between reminders after pressing "Snooze".
          default: 30
          selector:
            number:
              min: 1
              max: 720
              unit_of_measurement: min
              mode: box

mode: restart

variables:
  door_sensor: !input door_sensor
  tilt_sensor: !input tilt_sensor
  outdoor_sensor: !input outdoor_sensor
  scene_id: !input scene_id
  scene_entity: "scene.{{ scene_id }}"
  cold_threshold: !input cold_threshold
  cold_duration: !input cold_duration
  notify_title: !input notify_title
  notify_message: !input notify_message
  reminder_interval: !input reminder_interval
  max_reminders: !input max_reminders
  reminder_title: !input reminder_title
  reminder_message: !input reminder_message
  enable_buttons: !input enable_buttons
  snooze_minutes: !input snooze_minutes
  notify_tag: "window_heating_{{ scene_id }}"
  action_heat_on: "HEAT_ON_{{ scene_id }}"
  action_snooze: "SNOOZE_{{ scene_id }}"
  notification_actions: >
    {{ [{'action': action_heat_on, 'title': 'Turn heating back on'},
        {'action': action_snooze, 'title': 'Snooze ' ~ (snooze_minutes | int) ~ ' min'}]
       if enable_buttons else [] }}

triggers:
  - trigger: state
    entity_id: !input door_sensor
    to: "on"
    for: !input open_delay
    id: window_opened
  - trigger: state
    entity_id: !input tilt_sensor
    to: "on"
    for: !input open_delay
    id: window_tilted
  - trigger: state
    entity_id:
      - !input door_sensor
      - !input tilt_sensor
    to: "off"
    for: !input close_delay
    id: window_closed
  - trigger: numeric_state
    entity_id: !input outdoor_sensor
    below: !input cold_threshold
    id: cold

actions:
  # Do nothing while a window sensor is unavailable or unknown
  - condition: template
    value_template: >
      {{ states(door_sensor) not in ['unavailable', 'unknown']
         and states(tilt_sensor) not in ['unavailable', 'unknown'] }}

  - choose:
      # Window opened or tilted (after open delay): snapshot (once), heating off
      - conditions:
          - condition: trigger
            id:
              - window_opened
              - window_tilted
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ scene_entity not in states.scene | map(attribute='entity_id') | list }}
            then:
              - action: scene.create
                data:
                  scene_id: "{{ scene_id }}"
                  snapshot_entities: !input climate_entities
          - action: climate.turn_off
            target:
              entity_id: !input climate_entities

      # Window fully closed (after close delay): restore and dismiss warnings
      - conditions:
          - condition: trigger
            id: window_closed
          - condition: state
            entity_id: !input door_sensor
            state: "off"
          - condition: state
            entity_id: !input tilt_sensor
            state: "off"
        sequence:
          - if:
              - condition: template
                value_template: >
                  {{ scene_entity in states.scene | map(attribute='entity_id') | list }}
            then:
              - action: scene.turn_on
                target:
                  entity_id: "{{ scene_entity }}"
              - action: scene.delete
                target:
                  entity_id: "{{ scene_entity }}"
          - alias: Dismiss warnings on all devices
            repeat:
              for_each: !input notify_devices
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ notify_tag }}"

  # Cold weather warning: only continue if the window is open and it is cold
  - condition: template
    value_template: >
      {{ (is_state(door_sensor, 'on') or is_state(tilt_sensor, 'on'))
         and (states(outdoor_sensor) | float(99)) < (cold_threshold | float) }}
  - wait_template: >
      {{ not ((is_state(door_sensor, 'on') or is_state(tilt_sensor, 'on'))
         and (states(outdoor_sensor) | float(99)) < (cold_threshold | float)) }}
    timeout: "{{ (cold_duration | int) * 60 }}"
    continue_on_timeout: true
  - condition: template
    value_template: "{{ not wait.completed }}"

  # First warning, then repeat reminders while the window stays open
  - alias: Warn and remind while the window is open
    repeat:
      while:
        - condition: template
          value_template: >
            {{ states(door_sensor) not in ['unavailable', 'unknown']
               and states(tilt_sensor) not in ['unavailable', 'unknown']
               and (is_state(door_sensor, 'on') or is_state(tilt_sensor, 'on'))
               and (repeat.index == 1
                    or ((reminder_interval | int) > 0
                        and repeat.index <= (max_reminders | int) + 1)) }}
      sequence:
        # Capture values here: the inner for_each loop overwrites "repeat"
        - variables:
            warning_number: "{{ repeat.index }}"
            open_minutes: >-
              {%- set ns = namespace(t=now()) -%}
              {%- for e in [door_sensor, tilt_sensor] if is_state(e, 'on') -%}
              {%- if states[e].last_changed < ns.t -%}{%- set ns.t = states[e].last_changed -%}{%- endif -%}
              {%- endfor -%}
              {{ ((now() - ns.t).total_seconds() / 60) | round(0) | int }}
        - alias: Send warning to all devices
          repeat:
            for_each: !input notify_devices
            sequence:
              - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                data:
                  title: "{{ notify_title if warning_number | int == 1 else reminder_title }}"
                  message: >
                    {{ notify_message if warning_number | int == 1 else reminder_message }}
                    Outdoor temperature: {{ states(outdoor_sensor) }} °C.
                    The window has been open for {{ open_minutes }} minutes.
                  data:
                    tag: "{{ notify_tag }}"
                    actions: "{{ notification_actions }}"
        - if:
            - condition: template
              value_template: "{{ (reminder_interval | int) > 0 }}"
          then:
            # Wait for a button press, or until the next reminder is due
            - wait_for_trigger:
                - trigger: event
                  event_type: mobile_app_notification_action
              timeout: "{{ (reminder_interval | int) * 60 }}"
              continue_on_timeout: true
            - choose:
                # "Turn heating back on" pressed
                - conditions:
                    - condition: template
                      value_template: >
                        {{ wait.trigger is not none
                           and wait.trigger.event.data.action == action_heat_on }}
                  sequence:
                    - if:
                        - condition: template
                          value_template: >
                            {{ scene_entity in states.scene | map(attribute='entity_id') | list }}
                      then:
                        - action: scene.turn_on
                          target:
                            entity_id: "{{ scene_entity }}"
                        - action: scene.delete
                          target:
                            entity_id: "{{ scene_entity }}"
                    - alias: Dismiss warnings on all devices
                      repeat:
                        for_each: !input notify_devices
                        sequence:
                          - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                            data:
                              message: clear_notification
                              data:
                                tag: "{{ notify_tag }}"
                    - stop: Heating restored from notification button
                # "Snooze" pressed
                - conditions:
                    - condition: template
                      value_template: >
                        {{ wait.trigger is not none
                           and wait.trigger.event.data.action == action_snooze }}
                  sequence:
                    - delay:
                        minutes: "{{ snooze_minutes | int }}"
